# Automatización de reservas para restaurantes con n8n.
#   Desarrollo:  docker compose --profile dev up -d      (correo de pruebas en http://localhost:8025)
#   Producción:  docker compose --profile prod up -d     (HTTPS automático con Caddy en $DOMINIO)

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  GENERIC_TIMEZONE: Europe/Madrid
  TZ: Europe/Madrid
  N8N_HOST: ${DOMINIO:-localhost}
  WEBHOOK_URL: ${URL_PUBLICA}/
  N8N_EDITOR_BASE_URL: ${URL_PUBLICA}/
  N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  N8N_RUNNERS_ENABLED: "true"
  # Configuración del restaurante (la leen los flujos con $env)
  REST_NOMBRE: ${REST_NOMBRE}
  REST_EMAIL_DUENO: ${REST_EMAIL_DUENO}
  REST_EMAIL_REMITENTE: ${REST_EMAIL_REMITENTE}
  REST_TELEFONO: ${REST_TELEFONO}
  REST_DIRECCION: ${REST_DIRECCION}
  REST_AFORO_COMIDA: ${REST_AFORO_COMIDA:-40}
  REST_AFORO_CENA: ${REST_AFORO_CENA:-40}
  REST_ENTRADAS_FRANJA: ${REST_ENTRADAS_FRANJA:-16}
  REST_ANTELACION_MIN: ${REST_ANTELACION_MIN:-60}
  REST_DIAS_MAX: ${REST_DIAS_MAX:-60}
  REST_HORAS_COMIDA: ${REST_HORAS_COMIDA:-13:00,13:30,14:00,14:30,15:00}
  REST_HORAS_CENA: ${REST_HORAS_CENA:-20:00,20:30,21:00,21:30,22:00}
  REST_DIAS_CERRADO: ${REST_DIAS_CERRADO:-1}
  REST_MAX_PERSONAS: ${REST_MAX_PERSONAS:-10}
  REST_URL_RESENA: ${REST_URL_RESENA}
  REST_CLAVE_PANEL: ${REST_CLAVE_PANEL}
  REST_CLAVE_AGENTE: ${REST_CLAVE_AGENTE}
  # Los nodos de código pueden usar el módulo crypto (tokens seguros de las reservas)
  NODE_FUNCTION_ALLOW_BUILTIN: crypto

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.84
    restart: unless-stopped
    environment: *n8n-env
    ports:
      # Solo accesible desde el propio equipo: desde fuera se entra por Caddy (HTTPS).
      - "127.0.0.1:${PUERTO_LOCAL:-5680}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # Solo en desarrollo: captura todos los emails (SMTP en mailpit:1025, web en :8025)
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"

  # Solo en producción: HTTPS automático con Let's Encrypt
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - n8n

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
